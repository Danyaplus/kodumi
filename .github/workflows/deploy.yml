name: Deploy Kodumi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Verify generated website
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/projects/index.html
          test -s frontend/dist/technologies/python/index.html
          test -s frontend/dist/404.html
          test -s frontend/dist/sitemap.xml
          test -s frontend/dist/robots.txt
          grep -q 'id="site-header"' frontend/dist/index.html
          if grep -q '/frontend/src/main.jsx' frontend/dist/index.html; then
            echo 'Uncompiled source entry in production HTML'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
